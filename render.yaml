services:
  - type: web
    name: ecommerce-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn Ecommerce.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.buxiqvlwqkufiiwlhjlt
      - key: DB_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
